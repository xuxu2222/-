const CATS=[...new Set(DATA.flatMap(d=>d.cats))];
const state={q:'',region:'全部',cats:new Set(),flags:new Set(),cost:'全部'};
const costBands={'全部':null,'≤50':[0,50],'50-100':[51,100],'100+':[101,9999],'未知':null};
const $=s=>document.querySelector(s);
function chips(el,list,key,multi){
  el.insertAdjacentHTML('beforeend',`<span class="chip${state[key]=='全部'||[...state[key]].length==0?' on':''}" data-v="全部">全部</span>`);
  list.forEach(v=>{
    const c=document.createElement('span');c.className='chip';c.textContent=v;c.dataset.v=v;
    c.onclick=()=>{
      if(!multi){state[key]=v;[...el.children].forEach(x=>x.classList.toggle('on',x===c));}
      else{state[key].has(v)?state[key].delete(v):state[key].add(v);c.classList.toggle('on');}
      render();
    };
    el.appendChild(c);
  });
}
chips($('#regions'),REGIONS,'region',false);
chips($('#cats'),CATS,'cats',true);
chips($('#flags'),['强推','避雷','要排队','可外卖'],'flags',true);
// cost single
(()=>{const el=$('#costs');Object.keys(costBands).forEach(v=>{const c=document.createElement('span');c.className='chip'+(v=='全部'?' on':'');c.textContent=v;c.onclick=()=>{state.cost=v;[...el.querySelectorAll('.chip')].forEach(x=>x.classList.toggle('on',x===c));render();};el.appendChild(c);});})();
$('#q').oninput=e=>{state.q=e.target.value.trim().toLowerCase();render();};
$('#reset').onclick=()=>{state.q='';$('#q').value='';state.region='全部';state.cats.clear();state.flags.clear();state.cost='全部';document.querySelectorAll('#regions .chip,#costs .chip').forEach((c,i,a)=>c.classList.toggle('on',c.dataset.v=='全部'));document.querySelectorAll('#cats .chip,#flags .chip').forEach(c=>c.classList.remove('on'));render();};
function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function hl(t){if(!state.q)return esc(t);return esc(t).replace(new RegExp('('+state.q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<span class="hl">$1</span>');}
function match(d){
  if(state.region!='全部'&&d.region!=state.region)return false;
  if(state.cats.size&&![...state.cats].some(c=>d.cats.includes(c)))return false;
  if(state.flags.size&&![...state.flags].every(f=>d.flags.includes(f)))return false;
  const b=costBands[state.cost];
  if(state.cost=='未知'){if(d.cost!=null)return false;}
  else if(b){if(d.cost==null||d.cost<b[0]||d.cost>b[1])return false;}
  if(state.q){const hay=(d.name+' '+d.loc+' '+d.text+' '+d.cats.join(' ')).toLowerCase();if(!state.q.split(/\s+/).every(w=>hay.includes(w)))return false;}
  return true;
}
function render(){
  const show=DATA.filter(match);
  $('#count').textContent=`显示 ${show.length} / ${DATA.length} 家`;
  $('#list').innerHTML=show.map((d,i)=>`<div class="card" onclick="this.classList.toggle('open')">
    <div class="cname">${hl(d.name)||'（见描述）'}${d.loc?`<span class="cloc">📍${hl(d.loc)}</span>`:''}</div>
    <div class="badges"><span class="b hot">${d.region}</span>${d.cats.map(c=>`<span class="b cat">${c}</span>`).join('')}${d.cost?`<span class="b cost">人均≈${d.cost}</span>`:''}${d.flags.map(f=>`<span class="b ${f=='避雷'?'warn':'flag'}">${f}</span>`).join('')}</div>
    <div class="ctext">${hl(d.text)}</div></div>`).join('')||'<div class="empty">没有匹配的店，换个筛选条件试试～</div>';
}
render();
</script></body></html>
